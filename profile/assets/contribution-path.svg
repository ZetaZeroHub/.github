<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="300" viewBox="0 0 1080 300"><rect width="1080" height="300" rx="16" fill="#10241f"/><path d="M34 48h300" stroke="#b5a36a"/><text x="34" y="91" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Explore</text><text x="34" y="127" fill="#bdbdab" font-family="Arial,sans-serif" font-size="16">Find a concrete question</text><circle cx="39" cy="165" r="3" fill="#c4ac70"/><text x="55" y="171" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="17">Try a product</text><circle cx="39" cy="204" r="3" fill="#c4ac70"/><text x="55" y="210" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="17">Read an example</text><circle cx="39" cy="243" r="3" fill="#c4ac70"/><text x="55" y="249" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="17">Describe the problem</text><path d="M384 48h300" stroke="#b5a36a"/><text x="384" y="91" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Build</text><text x="384" y="127" fill="#bdbdab" font-family="Arial,sans-serif" font-size="16">Keep the scope small</text><circle cx="389" cy="165" r="3" fill="#c4ac70"/><text x="405" y="171" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="17">Discuss in the repository</text><circle cx="389" cy="204" r="3" fill="#c4ac70"/><text x="405" y="210" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="17">Make a focused change</text><circle cx="389" cy="243" r="3" fill="#c4ac70"/><text x="405" y="249" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="17">Show how to verify it</text><path d="M734 48h300" stroke="#b5a36a"/><text x="734" y="91" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="25" font-weight="bold">Share</text><text x="734" y="127" fill="#bdbdab" font-family="Arial,sans-serif" font-size="16">Make the work reusable</text><circle cx="739" cy="165" r="3" fill="#c4ac70"/><text x="755" y="171" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="17">Document the result</text><circle cx="739" cy="204" r="3" fill="#c4ac70"/><text x="755" y="210" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="17">Open a pull request</text><circle cx="739" cy="243" r="3" fill="#c4ac70"/><text x="755" y="249" fill="#e9e5d9" font-family="Arial,sans-serif" font-size="17">Learn from feedback</text></svg>